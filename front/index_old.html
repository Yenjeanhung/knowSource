<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniRAG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/font/lucide.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c-bg: #FFFFFF;
    --c-fg: #171717;
    --c-secondary: #737373;
    --c-muted: #F5F5F5;
    --c-muted-hover: #EDEDED;
    --c-border: #E5E5E5;
    --c-accent: #A16207;
    --c-danger: #DC2626;
    --c-success: #16A34A;
    --radius: 8px;
    --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--c-bg);
    color: var(--c-fg);
    line-height: 1.5;
    min-height: 100dvh;
  }

  /* ─── Layout ────────────────────────────── */
  .shell { max-width: 640px; margin: 0 auto; padding: 0 20px; min-height: 100dvh; display: flex; flex-direction: column; }

  /* ─── Header ────────────────────────────── */
  .header { display: flex; align-items: center; gap: 10px; padding: 20px 0 16px; border-bottom: 1px solid var(--c-border); margin-bottom: 24px; }
  .header .logo { display: flex; align-items: center; gap: 8px; }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--c-accent); }
  .header .spacer { flex: 1; }

  /* ─── Tabs ──────────────────────────────── */
  .tabs { display: flex; gap: 0; margin-bottom: 24px; }
  .tab {
    padding: 8px 0;
    margin-right: 24px;
    font-size: 14px;
    font-weight: 500;
    color: var(--c-secondary);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: color 150ms, border-color 150ms;
    font-family: var(--font);
  }
  .tab:hover { color: var(--c-fg); }
  .tab.active { color: var(--c-fg); border-bottom-color: var(--c-fg); font-weight: 700; }

  /* ─── Shared ────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border: 1px solid var(--c-border); border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; font-family: var(--font);
    cursor: pointer; background: var(--c-bg); color: var(--c-fg);
    transition: background 150ms, border-color 150ms, transform 100ms;
  }
  .btn:hover { background: var(--c-muted); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--c-fg); color: #fff; border-color: var(--c-fg); }
  .btn.primary:hover { opacity: 0.85; background: var(--c-fg); }
  .btn.danger { color: var(--c-danger); }
  .btn.danger:hover { background: #FEF2F2; border-color: var(--c-danger); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn .icon { font-size: 15px; }

  input[type="text"] {
    padding: 8px 12px; border: 1px solid var(--c-border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: var(--font); outline: none;
    transition: border-color 150ms; width: 100%;
  }
  input[type="text"]:focus { border-color: var(--c-fg); }
  input[type="text"]::placeholder { color: #B0B0B0; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--c-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

  /* ─── KB List View ──────────────────────── */
  .kb-toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  .kb-toolbar input { flex: 1; }

  .kb-list { display: flex; flex-direction: column; gap: 4px; }
  .kb-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background 150ms;
    border: 1px solid transparent;
  }
  .kb-item:hover { background: var(--c-muted); }
  .kb-item.selected { background: var(--c-muted); border-color: var(--c-border); }
  .kb-item .kb-icon { color: var(--c-secondary); flex-shrink: 0; }
  .kb-item .kb-info { flex: 1; min-width: 0; }
  .kb-item .kb-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kb-item .kb-meta { font-size: 12px; color: var(--c-secondary); }
  .kb-item .kb-count { font-size: 12px; color: var(--c-secondary); background: var(--c-muted); padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
  .kb-item .kb-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 150ms; }
  .kb-item:hover .kb-actions { opacity: 1; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--c-secondary); }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; color: var(--c-border); }
  .empty-state .title { font-size: 15px; font-weight: 700; color: var(--c-fg); margin-bottom: 4px; }
  .empty-state .desc { font-size: 13px; }

  /* ─── KB Detail View ────────────────────── */
  .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .detail-header .back { cursor: pointer; color: var(--c-secondary); display: flex; align-items: center; transition: color 150ms; background: none; border: none; padding: 4px; }
  .detail-header .back:hover { color: var(--c-fg); }
  .detail-header h2 { font-size: 16px; font-weight: 700; flex: 1; }
  .detail-header .kb-date { font-size: 12px; color: var(--c-secondary); }

  .upload-zone {
    border: 1.5px dashed var(--c-border); border-radius: var(--radius);
    padding: 24px; text-align: center; cursor: pointer;
    background: var(--c-muted); transition: border-color 150ms, background 150ms;
    margin-bottom: 16px;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--c-fg); background: var(--c-muted-hover); }
  .upload-zone .icon { font-size: 22px; color: var(--c-secondary); margin-bottom: 6px; }
  .upload-zone .label { font-size: 14px; font-weight: 600; }
  .upload-zone .hint { font-size: 12px; color: var(--c-secondary); margin-top: 2px; }
  .upload-zone input[type="file"] { display: none; }

  .file-list { display: flex; flex-direction: column; gap: 3px; }
  .file-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px;
    transition: background 150ms;
  }
  .file-row:hover { background: var(--c-muted); }
  .file-row .file-icon { color: var(--c-secondary); flex-shrink: 0; font-size: 15px; }
  .file-row .file-name { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-row .file-meta { font-size: 12px; color: var(--c-secondary); flex-shrink: 0; }
  .file-row .file-status { font-size: 12px; flex-shrink: 0; }
  .file-row .file-status.done { color: var(--c-success); }
  .file-row .file-status.uploading { color: var(--c-accent); }
  .file-row .file-status.error { color: var(--c-danger); }
  .file-row .progress-track { width: 60px; height: 3px; background: var(--c-border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .file-row .progress-fill { height: 100%; background: var(--c-fg); border-radius: 2px; transition: width 200ms; }
  .file-row .del-btn {
    background: none; border: none; cursor: pointer; color: var(--c-secondary);
    padding: 2px; border-radius: 3px; display: flex; align-items: center;
    transition: color 150ms; font-size: 14px; flex-shrink: 0;
  }
  .file-row .del-btn:hover { color: var(--c-danger); }

  /* ─── Query View ────────────────────────── */
  .query-section { display: flex; flex-direction: column; gap: 16px; }
  .kb-select { display: flex; flex-direction: column; gap: 6px; }
  .kb-select label { font-size: 13px; font-weight: 600; color: var(--c-secondary); }
  .kb-select select {
    padding: 8px 12px; border: 1px solid var(--c-border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: var(--font); outline: none; background: var(--c-bg);
    transition: border-color 150ms; cursor: pointer; appearance: auto;
  }
  .kb-select select:focus { border-color: var(--c-fg); }

  .query-row { display: flex; gap: 8px; }
  .query-row input { flex: 1; }
  .query-row button { white-space: nowrap; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--c-border); border-top-color: var(--c-fg); border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-secondary); }

  .results { display: flex; flex-direction: column; gap: 12px; }
  .results-header { font-size: 13px; color: var(--c-secondary); display: flex; align-items: center; gap: 6px; }
  .answer-card { border: 1px solid var(--c-border); border-radius: var(--radius); padding: 14px 16px; }
  .answer-card h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; color: var(--c-secondary); }
  .answer-card .answer-text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; }

  .chunk-item { border: 1px solid var(--c-border); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; }
  .chunk-item .chunk-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--c-secondary); }
  .chunk-item .chunk-score { font-weight: 700; color: var(--c-accent); }
  .chunk-item .chunk-text { line-height: 1.6; }

  /* ─── Modal ─────────────────────────────── */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; animation: fadeIn 150ms;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--c-bg); border-radius: var(--radius); padding: 24px;
    width: 360px; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .modal .field { margin-bottom: 16px; }
  .modal .field label { display: block; font-size: 13px; font-weight: 600; color: var(--c-secondary); margin-bottom: 6px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* ─── Responsive ────────────────────────── */
  @media (max-width: 480px) {
    .shell { padding: 0 14px; }
    .header { padding: 16px 0 12px; margin-bottom: 16px; }
    .query-row { flex-direction: column; }
    .query-row .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, computed, watch, nextTick } = Vue;

const API = 'http://localhost:8000';
const CHUNK_SIZE = 512 * 1024;
const uuid = () => ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));

createApp({
  setup() {
    // ─── State ──────────────────────────
    const tab = ref('kb');           // 'kb' | 'query'
    const kbSearch = ref('');
    const kbs = ref([]);
    const selectedKbId = ref(null);
    const kbDetail = ref(null);
    const files = ref([]);           // files in selected KB
    const uploadingFiles = ref({});  // id -> { progress }

    // Query
    const queryKbId = ref('');
    const queryText = ref('');
    const querying = ref(false);
    const answer = ref('');
    const chunks = ref([]);

    // Modal
    const showCreateModal = ref(false);
    const newKbName = ref('');
    const creating = ref(false);

    // ─── Computed ───────────────────────
    const filteredKbs = computed(() => {
      const q = kbSearch.value.toLowerCase().trim();
      if (!q) return kbs.value;
      return kbs.value.filter(kb => kb.name.toLowerCase().includes(q));
    });

    const queryKbList = computed(() => kbs.value.filter(kb => kb.file_count > 0));

    // ─── KB Actions ─────────────────────
    async function fetchKbs() {
      try { kbs.value = (await (await fetch(`${API}/api/kb`)).json()) || []; } catch {}
    }

    async function createKb() {
      const name = newKbName.value.trim();
      if (!name) return;
      creating.value = true;
      try {
        const kb = await (await fetch(`${API}/api/kb`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
        })).json();
        showCreateModal.value = false;
        newKbName.value = '';
        await fetchKbs();
        openKb(kb.id);
      } catch {}
      creating.value = false;
    }

    async function deleteKb(kbId, e) {
      e && e.stopPropagation();
      const kb = kbs.value.find(k => k.id === kbId);
      if (!confirm(`Delete "${kb?.name}" and all its files?`)) return;
      try { await fetch(`${API}/api/kb/${kbId}`, { method: 'DELETE' }); } catch {}
      if (selectedKbId.value === kbId) { selectedKbId.value = null; kbDetail.value = null; files.value = []; }
      await fetchKbs();
    }

    async function openKb(kbId) {
      selectedKbId.value = kbId;
      try {
        kbDetail.value = await (await fetch(`${API}/api/kb/${kbId}`)).json();
        files.value = kbDetail.value.files || [];
      } catch {}
    }

    function backToList() {
      selectedKbId.value = null;
      kbDetail.value = null;
      files.value = [];
      uploadingFiles.value = {};
      fetchKbs();
    }

    // ─── File Upload ────────────────────
    function triggerUpload() {
      const input = document.getElementById('fileInput');
      if (input) input.click();
    }

    async function handleFileDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      await handleFileList(e.dataTransfer.files);
    }

    async function handleFilePick(e) {
      await handleFileList(e.target.files);
      e.target.value = '';
    }

    async function handleFileList(list) {
      if (!selectedKbId.value) return;
      for (const file of list) {
        const id = uuid();
        const fileObj = { id, name: file.name, size: file.size, status: 'uploading' };
        files.value.push(fileObj);
        uploadingFiles.value[id] = { progress: 0 };
        await uploadFileChunks(id, file);
      }
    }

    async function uploadFileChunks(fileId, file) {
      const total = Math.ceil(file.size / CHUNK_SIZE);
      try {
        for (let i = 0; i < total; i++) {
          const chunk = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          const form = new FormData();
          form.append('file_id', fileId);
          form.append('file_name', file.name);
          form.append('file_size', file.size);
          form.append('kb_id', selectedKbId.value);
          form.append('chunk_index', i);
          form.append('total_chunks', total);
          form.append('chunk', chunk);
          const res = await fetch(`${API}/api/upload/chunk`, { method: 'POST', body: form });
          if (!res.ok) throw new Error('Upload failed');
          uploadingFiles.value[fileId] = { progress: Math.round(((i + 1) / total) * 100) };
        }
        const f = files.value.find(f => f.id === fileId);
        if (f) f.status = 'done';
      } catch {
        const f = files.value.find(f => f.id === fileId);
        if (f) f.status = 'error';
      }
      delete uploadingFiles.value[fileId];
    }

    async function deleteFile(fileId) {
      try { await fetch(`${API}/api/files/${fileId}`, { method: 'DELETE' }); } catch {}
      files.value = files.value.filter(f => f.id !== fileId);
      await fetchKbs(); // update file_count
    }

    function getProgress(fileId) {
      return uploadingFiles.value[fileId]?.progress || 0;
    }

    // ─── Query ──────────────────────────
    async function runQuery() {
      const q = queryText.value.trim();
      if (!q || !queryKbId.value) return;
      querying.value = true;
      answer.value = '';
      chunks.value = [];
      try {
        const res = await fetch(`${API}/api/query`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, kb_id: queryKbId.value, top_k: 5 })
        });
        const data = await res.json();
        answer.value = data.answer || '';
        chunks.value = data.chunks || [];
      } catch (err) {
        answer.value = `Error: ${err.message}`;
      }
      querying.value = false;
    }

    // ─── Init ───────────────────────────
    fetchKbs();

    return {
      tab, kbSearch, kbs, filteredKbs, selectedKbId, kbDetail, files, uploadingFiles,
      queryKbId, queryText, querying, answer, chunks, queryKbList,
      showCreateModal, newKbName, creating,
      fetchKbs, createKb, deleteKb, openKb, backToList,
      triggerUpload, handleFileDrop, handleFilePick, deleteFile, getProgress,
      runQuery,
      fmtSize(v) { return v < 1024 ? v+' B' : v < 1048576 ? (v/1024).toFixed(1)+' KB' : (v/1048576).toFixed(1)+' MB'; },
    };
  },

  template: `
  <div class="shell">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="4"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/>
        </svg>
        <h1>MiniRAG</h1>
        <div class="dot"></div>
      </div>
      <div class="spacer"></div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab" :class="{ active: tab === 'kb' }" @click="tab = 'kb'; backToList()">Knowledge Base</button>
      <button class="tab" :class="{ active: tab === 'query' }" @click="tab = 'query'; fetchKbs()">Query</button>
    </div>

    <!-- ═══ KB Tab ═══ -->
    <template v-if="tab === 'kb'">

      <!-- KB List -->
      <template v-if="!selectedKbId">
        <div class="kb-toolbar">
          <input type="text" v-model="kbSearch" placeholder="Search knowledge bases...">
          <button class="btn primary" @click="showCreateModal = true">
            <span class="icon">+</span> New
          </button>
        </div>

        <div v-if="filteredKbs.length" class="kb-list">
          <div class="kb-item" v-for="kb in filteredKbs" :key="kb.id" @click="openKb(kb.id)">
            <svg class="kb-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
            </svg>
            <div class="kb-info">
              <div class="kb-name">{{ kb.name }}</div>
              <div class="kb-meta">{{ kb.file_count }} file{{ kb.file_count !== 1 ? 's' : '' }}</div>
            </div>
            <span class="kb-count">{{ kb.file_count }}</span>
            <div class="kb-actions">
              <button class="btn danger" style="padding:4px 8px;font-size:12px" @click="deleteKb(kb.id, $event)">Delete</button>
            </div>
          </div>
        </div>

        <div v-else class="empty-state">
          <div class="icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
            </svg>
          </div>
          <div class="title" v-if="kbSearch">No matching knowledge bases</div>
          <div class="title" v-else>No knowledge bases yet</div>
          <div class="desc" v-if="!kbSearch">Click "New" to create your first one</div>
        </div>
      </template>

      <!-- KB Detail -->
      <template v-else>
        <div class="detail-header">
          <button class="back" @click="backToList">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6"/>
            </svg>
          </button>
          <h2>{{ kbDetail?.name || '...' }}</h2>
          <button class="btn danger" style="padding:5px 10px;font-size:12px" @click="deleteKb(selectedKbId); tab = 'kb'">Delete KB</button>
        </div>

        <!-- Upload -->
        <div class="upload-zone" @click="triggerUpload" @dragover.prevent="$event.currentTarget.classList.add('drag-over')" @dragleave="$event.currentTarget.classList.remove('drag-over')" @drop="handleFileDrop">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="label">Drop files or click to upload</div>
          <div class="hint">Chunked upload, max 512KB per chunk</div>
          <input id="fileInput" type="file" multiple accept=".txt,.pdf,.md,.csv,.json,.docx,.html" @change="handleFilePick" style="display:none">
        </div>

        <!-- File List -->
        <div class="section-title">Files ({{ files.length }})</div>
        <div class="file-list" v-if="files.length">
          <div class="file-row" v-for="f in files" :key="f.id">
            <svg class="file-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
            <span class="file-name">{{ f.name }}</span>
            <span class="file-meta">{{ fmtSize(f.size) }}</span>
            <template v-if="uploadingFiles[f.id]">
              <div class="progress-track"><div class="progress-fill" :style="{ width: getProgress(f.id) + '%' }"></div></div>
              <span class="file-status uploading">{{ getProgress(f.id) }}%</span>
            </template>
            <span v-else class="file-status" :class="f.status">{{ f.status === 'done' ? 'Done' : f.status === 'error' ? 'Error' : f.status }}</span>
            <button class="del-btn" @click="deleteFile(f.id)" :title="'Remove'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
        <div v-else class="empty-state" style="padding:24px">
          <div class="desc">No files in this knowledge base</div>
        </div>
      </template>
    </template>

    <!-- ═══ Query Tab ═══ -->
    <template v-if="tab === 'query'">
      <div class="query-section">

        <div class="kb-select">
          <label>Knowledge Base</label>
          <select v-model="queryKbId">
            <option value="" disabled>Select a knowledge base...</option>
            <option v-for="kb in queryKbList" :key="kb.id" :value="kb.id">{{ kb.name }} ({{ kb.file_count }} files)</option>
          </select>
        </div>

        <div class="query-row">
          <input type="text" v-model="queryText" placeholder="Ask a question..." @keydown.enter="runQuery" :disabled="!queryKbId || querying">
          <button class="btn primary" @click="runQuery" :disabled="!queryKbId || !queryText.trim() || querying">
            <template v-if="querying"><span class="spinner"></span></template>
            <template v-else>Search</template>
          </button>
        </div>

        <!-- Results -->
        <div class="results" v-if="answer || chunks.length">
          <div class="results-header" v-if="chunks.length">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            {{ chunks.length }} chunk{{ chunks.length > 1 ? 's' : '' }} retrieved
          </div>

          <div class="answer-card" v-if="answer">
            <h4>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/></svg>
              Answer
            </h4>
            <div class="answer-text">{{ answer }}</div>
          </div>

          <div v-for="(c, i) in chunks" :key="i" class="chunk-item">
            <div class="chunk-header">
              <span>{{ c.file_name }}</span>
              <span class="chunk-score">{{ c.score.toFixed(4) }}</span>
            </div>
            <div class="chunk-text">{{ c.text }}</div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ Create KB Modal ═══ -->
    <div class="modal-mask" v-if="showCreateModal" @click.self="showCreateModal = false">
      <div class="modal" @click.stop>
        <h3>New Knowledge Base</h3>
        <div class="field">
          <label>Name</label>
          <input type="text" v-model="newKbName" placeholder="e.g. Project Docs" @keydown.enter="createKb" ref="nameInput" autofocus>
        </div>
        <div class="actions">
          <button class="btn" @click="showCreateModal = false">Cancel</button>
          <button class="btn primary" @click="createKb" :disabled="!newKbName.trim() || creating">{{ creating ? 'Creating...' : 'Create' }}</button>
        </div>
      </div>
    </div>
  </div>
  `
}).mount('#app');
</script>
</body>
</html>
